<section id="contact" class="py-20 border-t border-slate-800/60">
    <div class="max-w-3xl mx-auto px-6">
        <div class="flex items-center gap-3 mb-4">
            <h2 class="text-3xl font-extrabold text-slate-100">Send a Message</h2>
            <div class="h-[2px] w-24 gradient-border rounded-full"></div>
        </div>
        <p class="text-slate-400 mb-8 text-sm">Have an AI project or opportunity? Send me a message directly from here.</p>
        <form id="contact-form" class="glass-card p-8 rounded-2xl space-y-5">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Your Name</label>
                <input type="text" name="user_name" placeholder="John Doe" required class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-[#00f5d4] transition">
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Your Email</label>
                <input type="email" name="user_email" placeholder="john@example.com" required class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-[#00f5d4] transition">
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-2">Your Message</label>
                <textarea name="message" placeholder="Write your message here..." rows="5" required class="w-full px-4 py-3 bg-slate-950/80 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-[#00f5d4] transition resize-none"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-[#00f5d4] text-slate-950 py-3.5 rounded-xl font-bold hover:bg-[#00f5d4]/90 transition shadow-lg shadow-[#00f5d4]/20">
                Send Message
            </button>
            <p id="form-status" class="hidden text-sm font-medium text-center mt-3"></p>
        </form>
    </div>
</section>

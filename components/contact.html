<section id="contact" class="py-20 border-t border-white/10">
    <div class="max-w-3xl mx-auto px-6 space-y-8">
        <div class="text-center">
            <h2 class="auto-name-jump text-2xl sm:text-3xl font-black uppercase tracking-[0.18em] text-white">
                CONTACT<span data-auto-color="text" class="accent-text">.</span>
            </h2>
        </div>

        <form id="contact-form" class="project-card-anim bg-[#0e0e12] border red-card-glow rounded-xl p-6 sm:p-7 space-y-4">
            <input type="text" name="from_name" required placeholder="Your Name"
                   class="w-full px-4 py-3 rounded-lg bg-black/75 border border-white/15 text-sm text-white placeholder-zinc-500 focus:outline-none accent-border-hover transition" />

            <input type="email" name="from_email" required placeholder="Your Email"
                   class="w-full px-4 py-3 rounded-lg bg-black/75 border border-white/15 text-sm text-white placeholder-zinc-500 focus:outline-none accent-border-hover transition" />

            <textarea name="message" rows="4" required placeholder="Message"
                      class="w-full px-4 py-3 rounded-lg bg-black/75 border border-white/15 text-sm text-white placeholder-zinc-500 focus:outline-none accent-border-hover transition"></textarea>

            <button type="submit" id="submit-btn"
                    class="contact-rainbow-btn w-full py-3.5 rounded-lg text-xs sm:text-sm font-black uppercase tracking-[0.16em]">
                Send Message
            </button>

            <p id="form-status" class="text-center text-xs hidden"></p>
        </form>
    </div>
</section>

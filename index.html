<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almas Hossen - AI Engineering, Python Developer (FastAPI, Django) & DevOps Expert</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #060913;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(0, 245, 212, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 245, 212, 0.15);
        }
        .gradient-text {
            background: linear-gradient(135deg, #00f5d4 0%, #00b4d8 50%, #7209b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-border {
            background: linear-gradient(90deg, #00f5d4, #00b4d8);
        }

        /* Smooth Left-Right Slide Animation for Top Badge */
        @keyframes moveLeftRight {
            0% {
                transform: translateX(-12px);
            }
            50% {
                transform: translateX(12px);
            }
            100% {
                transform: translateX(-12px);
            }
        }

        .animate-slide-horizontal {
            display: inline-block;
            animation: moveLeftRight 4s ease-in-out infinite;
        }

        /* Floating Up and Down Animation for Profile Picture */
        @keyframes floatImage {
            0%, 100% {
                transform: translateY(0px) scale(1);
                filter: drop-shadow(0 15px 25px rgba(0, 245, 212, 0.25));
            }
            50% {
                transform: translateY(-12px) scale(1.02);
                filter: drop-shadow(0 25px 35px rgba(0, 245, 212, 0.4));
            }
        }

        .animate-float-floating {
            animation: floatImage 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="selection:bg-[#00f5d4] selection:text-black antialiased overflow-x-hidden">

    <!-- BACKGROUND GLOW -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-[#00f5d4]/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-1/3 right-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[140px] pointer-events-none -z-10"></div>

    <!-- COMPONENTS LOAD CONTAINER -->
    <div id="navbar-container"></div>
    <div id="hero-container"></div>
    <div id="about-container"></div>
    <div id="solutions-container"></div>
    <div id="projects-container"></div>
    <div id="resume-container"></div>
    <div id="skills-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>

    <!-- CV PREVIEW MODAL -->
    <div id="cv-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-4xl h-[85vh] rounded-2xl flex flex-col overflow-hidden border border-[#00f5d4]/40">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/80">
                <h3 class="text-lg font-bold text-[#00f5d4]">📄 Online CV Preview</h3>
                <button onclick="closeCvModal()" class="text-slate-400 hover:text-white text-xl font-bold px-3 py-1 rounded-lg bg-slate-900 border border-slate-800">✕</button>
            </div>
            <div class="flex-1 w-full bg-slate-900">
                <iframe src="Almas_Hossen_Python_Backend_AI_Developer_CV.pdf" class="w-full h-full" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- EMAILJS & SCRIPTS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("w8QWEL3PV7zl4ePGq");
        })();

        // Load Components Dynamically
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);
                if (response.ok) {
                    document.getElementById(id).innerHTML = await response.text();
                }
            } catch (error) {
                console.error(`Error loading ${file}:`, error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadComponent('navbar-container', 'components/navbar.html');
            loadComponent('hero-container', 'components/hero.html');
            loadComponent('about-container', 'components/about.html');
            loadComponent('solutions-container', 'components/solutions.html');
            loadComponent('projects-container', 'components/projects.html');
            loadComponent('resume-container', 'components/resume.html');
            loadComponent('skills-container', 'components/skills.html');
            loadComponent('contact-container', 'components/contact.html');
            loadComponent('footer-container', 'components/footer.html');
        });

        // CV Modal Functions
        function openCvModal() {
            document.getElementById('cv-modal').classList.remove('hidden');
        }
        function closeCvModal() {
            document.getElementById('cv-modal').classList.add('hidden');
        }

        // Contact Form Submission Handler (Event Delegation)
        document.addEventListener('submit', function(event) {
            if (event.target && event.target.id === 'contact-form') {
                event.preventDefault();
                const btn = document.getElementById('submit-btn');
                const status = document.getElementById('form-status');
                btn.innerText = 'Sending...';

                emailjs.sendForm('service_uzsy639', 'template_tb6j5nh', event.target)
                    .then(function() {
                        btn.innerText = 'Send Message';
                        status.classList.remove('hidden', 'text-red-400');
                        status.classList.add('text-emerald-400');
                        status.innerText = '✅ Message sent successfully! I will reply soon.';
                        event.target.reset();
                    })
                    .catch(function(error) {
                        btn.innerText = 'Send Message';
                        status.classList.remove('hidden', 'text-emerald-400');
                        status.classList.add('text-red-400');
                        status.innerText = '❌ Failed to send message. Please try again.';
                        console.error('FAILED...', error);
                    });
            }
        });
    </script>
</body>
</html>
